<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Java Learn — A comprehensive, structured guide to mastering Java from fundamentals to Spring Boot. Browse 25+ topics across Fundamentals, OOP, Core Java, Advanced, and Spring Boot." />
  <meta name="keywords" content="Java, Learn Java, OOP, Spring Boot, Collections, Multithreading, Java Tutorial" />
  <meta property="og:title" content="Java Learn — Master Java From Scratch" />
  <meta property="og:description" content="A modern, structured Java learning platform covering Fundamentals through Spring Boot." />
  <meta property="og:type" content="website" />
  <title>Java Learn — Master Java From Scratch</title>

  <!-- Favicon & Mobile Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#0F1115" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>

  <div class="dashboard-wrapper">
    <!-- 1. Left Sidebar -->
    <aside class="left-sidebar" id="left-sidebar">
      <div class="sidebar-logo-container">
        <a href="index.html" class="header-logo" aria-label="Java Learn homepage">
          <span class="logo-icon"><img src="https://upload.wikimedia.org/wikipedia/en/3/30/Java_programming_language_logo.svg" alt="Java Logo" width="28" height="28"></span>
          <div class="logo-text-group">
            <span class="logo-text">Java Learn</span>
            <span class="logo-subtext">Code · Learn · Grow</span>
          </div>
        </a>
        <button id="mobile-sidebar-close" class="mobile-sidebar-close-btn" aria-label="Close sidebar">✕</button>
      </div>

      <nav class="sidebar-nav" id="pathway-nav">
        <!-- We use pathway-nav ID so existing app.js tab click logic works -->
        <button class="sidebar-nav-item active pathway-tab" data-pathway="dashboard" id="tab-dashboard" title="Dashboard Overview">
          <span class="nav-icon">📊</span>
          <span class="nav-text">Dashboard</span>
        </button>

        <div class="nav-section-title" id="nav-paths-toggle" role="button" tabindex="0" aria-expanded="true">
          <span>Learning Paths</span>
          <span class="nav-paths-icon" id="nav-paths-icon">▼</span>
        </div>
        <div class="nav-paths-list" id="nav-paths-content">
          <button class="sidebar-nav-subitem pathway-tab" data-pathway="java" id="tab-java" title="Java Fundamentals">
            <span class="nav-icon">☕</span> Java
          </button>
          <button class="sidebar-nav-subitem pathway-tab" data-pathway="springboot" id="tab-springboot" title="Spring Boot Framework">
            <span class="nav-icon">🌱</span> Spring Boot
          </button>
          <button class="sidebar-nav-subitem pathway-tab" data-pathway="microservices" id="tab-microservices" title="Microservices Architecture">
            <span class="nav-icon">🕸️</span> Microservices
          </button>
          <button class="sidebar-nav-subitem pathway-tab" data-pathway="kafka" id="tab-kafka" title="Apache Kafka">
            <span class="nav-icon">🐿️</span> Kafka
          </button>
          <button class="sidebar-nav-subitem pathway-tab" data-pathway="aws" id="tab-aws" title="Amazon Web Services">
            <span class="nav-icon">☁️</span> AWS
          </button>
        </div>

        <button class="sidebar-nav-item pathway-tab" data-pathway="interview" id="tab-interview" title="Interview Preparation">
          <span class="nav-icon">💼</span>
          <span class="nav-text">Interview Prep</span>
        </button>
        <button class="sidebar-nav-item pathway-tab" data-pathway="requestflow" id="tab-requestflow" title="System Request Flows">
          <span class="nav-icon">🔄</span>
          <span class="nav-text">Request Flows</span>
        </button>
        <button class="sidebar-nav-item pathway-tab" data-pathway="notes" id="tab-notes" title="Your Study Notes">
          <span class="nav-icon">📝</span>
          <span class="nav-text">Notes</span>
        </button>
        <button class="sidebar-nav-item pathway-tab" data-pathway="studyplan" id="tab-studyplan" title="Your Study Planner">
          <span class="nav-icon">📅</span>
          <span class="nav-text">Study Plan</span>
        </button>
        <button class="sidebar-nav-item pathway-tab" data-pathway="profile" id="tab-profile" title="Your Profile">
          <span class="nav-icon">👤</span>
          <span class="nav-text">Profile</span>
        </button>
        <button class="sidebar-nav-item" title="Settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-text">Settings</span>
        </button>
      </nav>

      <div class="theme-toggle-container mobile-only-theme" style="margin-top: var(--space-4); display: flex; align-items: center; justify-content: space-between;">
        <span class="theme-label" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);"><span id="mobile-theme-icon">🌙</span> Theme</span>
        <label class="toggle-switch">
          <input type="checkbox" id="mobile-theme-toggle-checkbox">
          <span class="slider round"></span>
        </label>
      </div>
    </aside>

    <!-- Floating Edge Toggles -->
    <button class="desktop-toggle-btn edge-toggle edge-toggle-left" id="desktop-left-toggle" title="Toggle Left Sidebar">
      <span class="icon">❮</span>
    </button>
    <button class="desktop-toggle-btn edge-toggle edge-toggle-right" id="desktop-right-toggle" title="Toggle Right Sidebar">
      <span class="icon">❯</span>
    </button>

    <!-- 2. Main Content Center -->
    <main class="main-content" id="main-content">
      <header class="main-topbar">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Toggle navigation">
          <span class="hamburger-icon">☰</span>
        </button>
        <div class="search-wrap">
          <span class="search-icon">🔍</span>
          <input type="search" id="search-input" placeholder="Search topics, paths or keywords…" aria-label="Search topics">
          <span class="search-shortcut" aria-hidden="true">/</span>
        </div>
        <div class="topbar-actions">
          <div class="streak-badge" title="Daily study streak">
            <span class="streak-fire">🔥</span>
            <span class="streak-count" id="header-streak-count">0</span>
            <span class="streak-label">Streak</span>
          </div>
          <div class="topbar-theme-toggle">
            <span id="top-theme-icon" class="top-theme-icon">🌙</span>
            <label class="toggle-switch" aria-label="Toggle theme">
              <input type="checkbox" id="theme-toggle-checkbox">
              <span class="slider round"></span>
            </label>
          </div>
          <button class="notification-btn" aria-label="Notifications" title="Notifications">
            <span class="bell-icon">🔔</span>
            <span class="notification-badge">3</span>
          </button>
          <div class="user-profile" id="user-profile-btn" role="button" tabindex="0" aria-label="User profile">
            <img src="https://ui-avatars.com/api/?name=Learner&background=f97316&color=fff" alt="User Avatar" class="avatar-img">
            <div class="user-info">
              <span class="user-name">Learner</span>
              <span class="user-level" id="header-user-level">Level 1</span>
            </div>
            <span class="dropdown-icon" aria-hidden="true">▼</span>
          </div>
        </div>
      </header>

      <!-- Old category sidebar (hidden in dashboard, shown for topics) -->
      <aside id="home-sidebar" aria-label="Category navigation" style="display:none;"></aside>
      
      <!-- Progress Bar (shown for topics) -->
      <div id="progress-container" aria-live="polite" aria-atomic="true"></div>

      <!-- Main Dynamic Grid -->
      <div id="topics-grid" aria-live="polite">
        <!-- Rendered by app.js -->
      </div>
    </main>

    <!-- 3. Right Sidebar -->
    <aside class="right-sidebar" id="right-sidebar">
      <!-- Rendered by app.js -->
    </aside>

  </div>

  <div class="mobile-overlay" id="mobile-overlay"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Quiz Modal Container -->
  <div id="quiz-modal-container"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
