<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24" />
      <stop offset="100%" stop-color="#0F1115" />
    </linearGradient>

    <!-- Subtle Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#262A33" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0.2" />
    </linearGradient>

    <!-- Ambient Center Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#FF6A00" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Radiant Orange Fire/Coffee Gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="60%" stop-color="#FF6A00" />
      <stop offset="100%" stop-color="#E55500" />
    </linearGradient>

    <!-- Steam Gold/Orange Gradient -->
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF6A00" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#FFA826" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFE082" stop-opacity="0.7" />
    </linearGradient>

    <!-- Shadow filter for 3D depth -->
    <filter id="glowDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#FF6A00" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />
  <circle cx="256" cy="270" r="180" fill="url(#centerGlow)" />

  <g filter="url(#glowDrop)">
    <!-- Steam Curves (Thick, confident, fluid wisps for 16px readability) -->
    <!-- Steam 1 (Left) -->
    <path d="M 200 215 C 185 185 210 155 195 125 C 185 105 170 95 175 80 C 180 98 200 110 208 128 C 224 162 198 188 214 215 Z"
          fill="url(#steamGrad)" />

    <!-- Steam 2 (Center - Tall & Majestic) -->
    <path d="M 256 210 C 240 170 270 135 252 95 C 242 75 225 65 230 45 C 238 65 260 78 270 100 C 290 142 258 175 272 210 Z"
          fill="url(#steamGrad)" />

    <!-- Steam 3 (Right) -->
    <path d="M 312 215 C 298 185 325 155 310 125 C 300 105 285 95 290 80 C 296 98 316 110 324 128 C 340 162 312 188 326 215 Z"
          fill="url(#steamGrad)" />

    <!-- Cup Handle (Bold ergonomic curved loop) -->
    <path d="M 330 260 C 400 260 415 350 330 360"
          fill="none"
          stroke="url(#cupGrad)"
          stroke-width="32"
          stroke-linecap="round" />

    <!-- Cup Body (Bold geometric silhouette) -->
    <path d="M 140 240 
             L 372 240 
             C 372 320 336 385 256 385 
             C 176 385 140 320 140 240 Z"
          fill="url(#cupGrad)" />

    <!-- Cup Rim Highlight -->
    <ellipse cx="256" cy="242" rx="116" ry="15" fill="#FFA842" opacity="0.45" />

    <!-- Code Accent on Cup (< / >) -->
    <g stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" fill="none">
      <!-- < -->
      <polyline points="230,295 210,312 230,330" />
      <!-- / -->
      <line x1="250" y1="334" x2="262" y2="290" />
      <!-- > -->
      <polyline points="282,295 302,312 282,330" />
    </g>

    <!-- Saucer / Foundation Pill -->
    <path d="M 120 415 C 120 405 392 405 392 415 C 392 432 120 432 120 415 Z"
          fill="url(#cupGrad)" />
  </g>
</svg>